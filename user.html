<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageForge – Author</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="topbar"><b>PageForge</b><span style="flex:1"></span><span id="who" style="font-size:13px"></span><span class="theme-tog" id="tm">🌙</span><a id="out" href="#">Log out</a></div>
<div class="shell"><nav class="side"><h2>Author</h2><small id="who2"></small>
<a data-v="mine">My pages</a><a data-v="browse">Published</a><a data-v="hist">Version history</a><a data-v="stats">My stats</a><span class="sp"></span><a id="out2">Log out</a></nav><main id="m"></main></div>
<script src="js/common.js"></script><script>
const U=guard('user');if(!U)throw 0;
$('#who').textContent=U.name;$('#who2').textContent=U.name+' · Author';$('#out').onclick=$('#out2').onclick=logout;
$('#tm').onclick=()=>setDark(!getDark());
document.querySelectorAll('.side [data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v,arg){document.querySelectorAll('.side [data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='edit'&&a.dataset.v==='mine')));({mine,browse,hist,stats,edit,templates})[v](arg)}
const M=h=>$('#m').innerHTML=h;
const mineList=()=>getPages().filter(p=>p.authorId===U.id);
function mine(){const ps=mineList();
 M(`<div class="top"><h1>My pages</h1><button class="pri" id="np">New page</button><button id="ts">Use template</button></div>${ps.length?`<div class="tw"><table><tr><th>Title</th><th>Status</th><th>Views</th><th>Updated</th><th></th></tr>${ps.map(p=>{const st=p.publishDate&&p.publishDate>Date.now()?'scheduled':p.status;return`<tr><td><strong>${esc(p.title.slice(0,40))}</strong>${st==='rejected'&&p.note?`<br><small style="color:var(--bad)">Rejected: ${esc(p.note)}</small>`:''}</td><td><span class="chip ${st}">${st}</span></td><td>${p.views}</td><td>${fmt(p.updated).slice(0,10)}</td>
 <td class="row">${['draft','rejected'].includes(p.status)?`<button class="sm" data-e="${p.id}">Edit</button>`:st==='published'?`<a class="btn sm" href="view.html?id=${p.id}" target="_blank">View</a>`:st==='scheduled'?`<button class="sm" data-e="${p.id}">Edit</button>`:'<small>In review</small>'}${!['published','pending'].includes(p.status)?`<button class="sm dng" data-d="${p.id}">Delete</button>`:''}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No pages yet. Click "New page".</div>'}`);
 $('#np').onclick=()=>go('edit',newPage(U));$('#ts').onclick=()=>go('templates');
 $('#m').onclick=e=>{const t=e.target.dataset;if(t.e)go('edit',getPages().find(p=>p.id===t.e));if(t.d&&confirm('Delete?')){savePages(getPages().filter(p=>p.id!==t.d));mine()}}}
function templates(){M(`<div class="top"><h1>Choose a template</h1></div><div class="tpls">${Object.entries(STARTERS).map(([k,v])=>`<div class="tpl-card" data-tpl="${k}"><b>${v.title}</b></div>`).join('')}</div>`);
 $('#m').onclick=e=>{if(e.target.dataset.tpl){const st=STARTERS[e.target.dataset.tpl],p=newPage(U);p.title=st.title;p.blocks=st.blocks;go('edit',p)}}}
function edit(pg){M(`<div class="top"><h1>${pg.title?'Edit':'New page'}</h1><button id="bk">Back</button></div><div id="ed"></div>`);$('#bk').onclick=()=>go('mine');
 mountEditor($('#ed'),pg,[{id:'save',label:'Save'},{id:'sub',label:'Submit',pri:1}],(a,p)=>{
  const all=getPages();if(all.some(x=>x.slug===p.slug&&x.id!==p.id))return toast('URL slug already used');
  p.status=a==='sub'?'pending':'draft';p.note='';p.updated=Date.now();
  const i=all.findIndex(x=>x.id===p.id);i<0?all.push(p):all[i]=p;savePages(all);toast(a==='sub'?'Submitted':'Saved');go('mine')})}
function browse(){const ps=getPages().filter(p=>p.status==='published'&&(!p.publishDate||p.publishDate<=Date.now()));
 const preview=p=>(p.blocks||[]).filter(b=>['heading','paragraph','quote','callout'].includes(b.type)&&b.text?.trim()).slice(0,2).map(b=>`<div class="pub-block"><small>${esc(b.type)}</small><p>${esc(b.text)}</p></div>`).join('');
 M(`<div class="top"><h1>Published pages</h1></div>${ps.length?`<div class="cards">${ps.map(p=>`<div class="panel"><b>${esc(p.title)}</b><p style="color:var(--mut);font-size:13px;margin:6px 0 12px">${esc(p.seo.desc||'No description')}</p><div class="pub-preview">${preview(p)}</div><small>${p.views} views</small><br><a class="btn sm" style="margin-top:8px" href="view.html?id=${p.id}" target="_blank">Read</a></div>`).join('')}</div>`:'<div class="empty">No pages published yet.</div>'}`)}
function hist(){const ps=mineList();
 const body=ps.length?ps.map(p=>{const vs=getVersions(p.id).slice().sort((a,b)=>b.updated-a.updated);return`<div class="panel" style="margin-bottom:14px"><b>${esc(p.title)}</b><div class="version" style="margin-top:10px;border:none;padding:0"><small>${vs.length} version${vs.length!==1?'s':''}</small></div>${vs.length?vs.map((v,i)=>`<div class="version ${i===0?'cur':''}"><b>v${vs.length-i}</b><small>${fmt(v.updated)} · ${v.blocks} block${v.blocks!==1?'s':''}</small></div>`).join(''):'<small style="color:var(--mut)">No history yet</small>'}</div>`}).join(''):'<div class="empty">No pages yet.</div>';
 M(`<div class="top"><h1>Version history</h1></div>${body}`)}
function stats(){const ps=mineList(),c=s=>ps.filter(p=>p.status===s).length;const sch=ps.filter(p=>p.publishDate&&p.publishDate>Date.now()).length;
 M(`<div class="top"><h1>My stats</h1></div><div class="cards"><div class="stat"><b>${ps.length}</b><span>Pages</span></div><div class="stat"><b>${c('published')}</b><span>Published</span></div><div class="stat"><b>${c('pending')}</b><span>In review</span></div><div class="stat"><b>${sch}</b><span>Scheduled</span></div><div class="stat"><b>${c('draft')}</b><span>Drafts</span></div><div class="stat"><b>${ps.reduce((a,p)=>a+p.views,0)}</b><span>Total views</span></div></div>`)}
go('mine');
</script></body></html>
