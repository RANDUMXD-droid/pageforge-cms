<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PageForge – Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="topbar"><b>PageForge</b><span style="flex:1"></span><span id="who" style="font-size:13px"></span><span class="theme-tog" id="tm">🌙</span><a id="out" href="#">Log out</a></div>
<div class="shell"><nav class="side"><h2>Admin</h2><small id="who2"></small>
<a data-v="dash">Analytics</a><a data-v="pages">All pages</a><a data-v="appr">Approvals <span id="bd"></span></a><a data-v="sched">Scheduled</a><a data-v="users">Users</a><span class="sp"></span><a id="out2">Log out</a></nav>
<main id="m"></main></div>
<script src="js/common.js"></script><script>
const U=guard('admin');if(!U)throw 0;
$('#who').textContent=U.name;$('#who2').textContent=U.name+' · Admin';$('#out').onclick=$('#out2').onclick=logout;
$('#tm').onclick=()=>setDark(!getDark());
let view='dash';
document.querySelectorAll('.side [data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v,arg){view=v;document.querySelectorAll('.side [data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='edit'&&a.dataset.v==='pages')));
 const pend=getPages().filter(p=>p.status==='pending').length;$('#bd').textContent=pend?'('+pend+')':'';
 ({dash,pages,appr,sched,users,edit})[v](arg)}
const M=h=>$('#m').innerHTML=h;
function dash(){const ps=getPages(),us=DB.get('users',[]),pub=ps.filter(p=>p.status==='published'&&(!p.publishDate||p.publishDate<=Date.now())),views=ps.reduce((a,p)=>a+p.views,0),mx=Math.max(1,...ps.map(p=>p.views));
 M(`<div class="top"><h1>Analytics</h1></div><div class="cards"><div class="stat"><b>${ps.length}</b><span>Total pages</span></div><div class="stat"><b>${pub.length}</b><span>Published</span></div>
 <div class="stat"><b>${ps.filter(p=>p.status==='pending').length}</b><span>In review</span></div><div class="stat"><b>${ps.filter(p=>p.status==='scheduled'&&p.publishDate&&p.publishDate>Date.now()).length}</b><span>Scheduled</span></div></div>
 <div class="panel"><h3 style="margin-bottom:12px">Views per page</h3>${ps.length?`<div style="display:flex;flex-direction:column;gap:10px">${[...ps].sort((a,b)=>b.views-a.views).slice(0,8).map(p=>`<div style="display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;font-size:13px"><span>${esc(p.title.slice(0,18))}</span><i style="display:block;height:14px;background:var(--acc);border-radius:4px;width:${p.views/mx*100}%"></i><b>${p.views}</b></div>`).join('')}</div>`:'<div class="empty" style="padding:20px">No pages yet</div>'}</div>`)}
function pages(){const ps=getPages();
 M(`<div class="top"><h1>All pages</h1><button class="pri" id="np">New page</button></div>${ps.length?`<div class="tw"><table><tr><th>Title</th><th>Author</th><th>Status</th><th>Views</th><th>Updated</th><th></th></tr>${ps.map(p=>`<tr><td><strong>${esc(p.title.slice(0,40))}</strong><br><small style="color:var(--mut)">/${esc(p.slug)}</small></td><td>${esc(p.author)}</td><td><span class="chip ${p.status}">${p.publishDate&&p.publishDate>Date.now()?'scheduled':p.status}</span></td><td>${p.views}</td><td>${fmt(p.updated).slice(0,10)}</td>
 <td class="row"><button class="sm" data-e="${p.id}">Edit</button>${p.status==='published'?`<a class="btn sm" href="view.html?id=${p.id}" target="_blank">View</a>`:''}<button class="sm dng" data-d="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No pages yet.</div>'}`);
 $('#np').onclick=()=>go('edit',newPage(U));
 $('#m').onclick=e=>{const t=e.target.dataset;if(t.e)go('edit',getPages().find(p=>p.id===t.e));
  if(t.d&&confirm('Delete this page?')){savePages(getPages().filter(p=>p.id!==t.d));go('pages')}}}
function edit(pg){M(`<div class="top"><h1>${pg.title?'Edit page':'New page'}</h1><button id="bk">Back</button></div><div id="ed"></div>`);$('#bk').onclick=()=>go('pages');
 mountEditor($('#ed'),pg,[{id:'save',label:'Save'},{id:'pub',label:'Publish',pri:1}],(a,p)=>{
  const all=getPages(),slugClash=all.some(x=>x.slug===p.slug&&x.id!==p.id);if(slugClash)return toast('URL slug already used');
  p.status=a==='pub'?'published':(p.publishDate&&p.publishDate>Date.now()?'scheduled':'draft');p.updated=Date.now();
  const i=all.findIndex(x=>x.id===p.id);if(i<0)all.push(p);else{p.views=all[i].views;all[i]=p}savePages(all);toast(a==='pub'?'Published':'Saved');go('pages')})}
function appr(){const ps=getPages().filter(p=>p.status==='pending');
 M(`<div class="top"><h1>Approvals (${ps.length})</h1></div>${ps.length?ps.map(p=>`<div class="panel" style="margin-bottom:14px"><div class="top" style="margin:0 0 8px"><div><b>${esc(p.title)}</b><br><small style="color:var(--mut)">by ${esc(p.author)} · SEO ${seoCheck(p).score}%</small></div>
 <div class="row"><button class="sm" data-p="${p.id}">Preview</button><button class="sm" data-e="${p.id}">Edit</button><button class="sm pri" data-a="${p.id}">Publish</button><button class="sm dng" data-r="${p.id}">Reject</button></div></div><div id="pv${p.id}"></div>
 <div class="comments" id="cm${p.id}"></div></div>`).join(''):'<div class="empty">Nothing to review.</div>'}`);
 $('#m').onclick=e=>{const t=e.target.dataset;
  if(t.p){const d=$('#pv'+t.p);d.innerHTML=d.innerHTML?'':`<div class="prev">${renderPage(getPages().find(x=>x.id===t.p))}</div>`}
  if(t.e)go('edit',getPages().find(p=>p.id===t.e));
  if(t.a){const pg=getPages().find(x=>x.id===t.a);pg.status='published';pg.updated=Date.now();if(pg.publishDate&&pg.publishDate<=Date.now())pg.publishDate=null;savePages(getPages().map(p=>p.id===t.a?pg:p));toast('Published');go('appr')}
  if(t.r){const n=prompt('Reason:');if(n!==null){const pg=getPages().find(x=>x.id===t.r);pg.status='rejected';pg.note=n;pg.updated=Date.now();savePages(getPages().map(p=>p.id===t.r?pg:p));toast('Rejected');go('appr')}}
};
 ps.forEach(p=>{const cs=getComments(p.id);const cm=$('#cm'+p.id);cm.innerHTML=`<h4>Comments (${cs.length})</h4>`+(cs.length?cs.map(c=>`<div class="comment"><b>${esc(c.author)}</b><small>${fmt(c.time)}</small><p>${esc(c.text)}</p></div>`).join(''):'<small style="color:var(--mut)">No comments yet.</small>')+`<div class="cmnt-form"><textarea id="ct${p.id}" rows="2" placeholder="Add a comment…" style="resize:vertical"></textarea><button data-ci="${p.id}" class="sm pri">Comment</button></div>`});
 $('#m').addEventListener('click',e=>{const id=e.target.dataset.ci;if(id){const txt=$('#ct'+id);if(txt.value.trim()){addComment(id,txt.value.trim());txt.value='';go('appr')}}});
}
function sched(){const ps=getPages().filter(p=>p.publishDate&&p.publishDate>Date.now());
 M(`<div class="top"><h1>Scheduled (${ps.length})</h1></div>${ps.length?ps.map(p=>`<div class="panel"><b>${esc(p.title)}</b><br><small style="color:var(--mut)">Publishes ${fmt(p.publishDate)}</small>
 <div class="row" style="margin-top:8px"><button class="sm" data-e="${p.id}">Edit</button><button class="sm" data-pub="${p.id}">Publish now</button><button class="sm dng" data-d="${p.id}">Delete</button></div></div>`).join(''):'<div class="empty">No scheduled posts.</div>'}`);
 $('#m').onclick=e=>{const t=e.target.dataset;if(t.e)go('edit',getPages().find(p=>p.id===t.e));
  if(t.pub){const pg=getPages().find(x=>x.id===t.pub);pg.publishDate=null;pg.status='published';savePages(getPages().map(p=>p.id===t.pub?pg:p));toast('Published now');go('sched')}
  if(t.d&&confirm('Delete?')){savePages(getPages().filter(p=>p.id!==t.d));go('sched')}
};
}
function users(){const us=DB.get('users',[]);
 M(`<div class="top"><h1>Users (${us.length})</h1></div><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td>
 <td><select data-r="${u.id}" ${u.id===U.id?'disabled':''} style="width:auto"><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td>
 <td>${u.id===U.id?'<small>You</small>':`<button class="sm dng" data-d="${u.id}">Delete</button>`}</td></tr>`).join('')}</table></div>`);
 $('#m').onchange=e=>{if(e.target.dataset.r){DB.set('users',DB.get('users',[]).map(u=>u.id===e.target.dataset.r?{...u,role:e.target.value}:u));toast('Updated')}};
 $('#m').onclick=e=>{const id=e.target.dataset.d;if(id&&confirm('Delete user?')){DB.set('users',DB.get('users',[]).filter(u=>u.id!==id));users()}}
}
go('dash');
</script></body></html>
