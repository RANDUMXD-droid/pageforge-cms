<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page</title><meta name="description" content=""><meta name="keywords" content=""><link rel="stylesheet" href="css/style.css"></head>
<body><div class="viewbar"><b>PageForge</b><span style="flex:1"></span><span class="theme-tog" id="tm">🌙</span><a href="javascript:history.length>1?history.back():location.href='index.html'">← Back</a></div><div class="viewwrap" id="v"></div>
<script src="js/common.js"></script><script>
$('#tm').onclick=()=>setDark(!getDark());
const u=me();if(!u)location.href='index.html';
const id=new URLSearchParams(location.search).get('id'),ps=getPages(),p=ps.find(x=>x.id===id);
if(!p||p.status!=='published'||(p.publishDate&&p.publishDate>Date.now()))$('#v').innerHTML='<div class="empty">This page is not available.</div>';
else{document.title=p.seo.title||p.title;document.querySelector('meta[name=description]').content=p.seo.desc;document.querySelector('meta[name=keywords]').content=p.seo.keywords;
 $('#v').innerHTML=renderPage(p);
 if(!sessionStorage.getItem('v'+id)){sessionStorage.setItem('v'+id,1);p.views++;savePages(ps)}}
</script></body></html>
